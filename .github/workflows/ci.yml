name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest

  frontend:
    # The dashboard's own gate, run beside the Python one rather than after it:
    # neither depends on the other, and a type error should not wait on pytest.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The version .devcontainer/devcontainer.json pins, so a Codespace and
          # CI build the same tree.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  pipeline:
    # A clean-machine proxy for the Codespace the graders use. A warm local
    # virtualenv hides dependency and permission problems; this does not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The dashboard is one deliverable among five, and it is the only one that
      # needs a second toolchain. If npm is missing or broken, `make setup` has
      # to warn and carry on, or a bad network day costs Parts 1 to 4 as well.
      - name: Confirm a broken npm does not take the data deliverables with it
        run: |
          mkdir -p "$RUNNER_TEMP/broken"
          printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/broken/npm"
          chmod +x "$RUNNER_TEMP/broken/npm"
          PATH="$RUNNER_TEMP/broken:$PATH" make setup
          test ! -d frontend/dist

      - name: Run the pipeline
        run: make pipeline

      - name: Confirm the database was created in the repository root
        run: test -f cell-count.db

      # outputs/ is committed, so regenerating it must be a no-op. This is the
      # only check that runs on a different machine from the one that committed
      # the files, which is where a PNG carrying a matplotlib version or a CSV
      # carrying CRLF would first show up.
      #
      # `git status --porcelain`, not `git diff`: the latter compares tracked
      # files only, so it passes vacuously while outputs/ is untracked and stays
      # blind to a newly added artifact filename afterwards.
      - name: Confirm the committed outputs are what the pipeline produces
        run: |
          changed="$(git status --porcelain --untracked-files=all outputs/)"
          if [ -n "$changed" ]; then
            echo "make pipeline did not reproduce the committed outputs:"
            echo "$changed"
            exit 1
          fi

      - name: Set up exactly as a grader would
        run: make setup

      # The third graded target, and the only one the suite cannot cover: the
      # tests drive the application through a test client, not through a process
      # that has to bind a port. Started in the background, polled until it
      # answers, then asked for an analysis and for the dashboard itself, rather
      # than merely for a 200.
      - name: Confirm the dashboard server starts and serves the analysis
        run: |
          make dashboard &
          for _ in $(seq 30); do
            if curl -sf http://127.0.0.1:8000/api/filters > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/subsets > /dev/null
          curl -sf http://127.0.0.1:8000/ | grep -q 'id="root"'
          pkill -f cellcount.api || true
