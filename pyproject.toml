[project]
name = "cellcount"
version = "0.1.0"
description = "Immune cell population analysis for the Loblaw Bio trial"
requires-python = ">=3.12"
dependencies = [
    # false_discovery_control (Benjamini-Hochberg) landed in scipy 1.11
    "scipy>=1.11",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",       # required by fastapi.testclient
    "ruff>=0.4",
    "mypy>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cellcount"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "PTH",  # prefer pathlib
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]   # load_data.py added in Phase 1, once it exists

# These ship without type information; we still type our own call sites.
[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*"]
ignore_missing_imports = true
